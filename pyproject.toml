[project]
name = "lifemate"
version = "2.0.0a0"
description = "器官化数字生命运行时：主体=认知自我（思维·记忆·人格），一切外界=可拆卸器官"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lifemate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
