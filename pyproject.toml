[project]
name = "lifemate"
version = "2.0.0"
description = "器官化数字生命运行时：主体=认知自我（思维·记忆·人格），一切外界=可拆卸器官"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "websockets>=12",                                  # QQ 插件感知面（NapCat WS）
    "tzdata>=2024.1; platform_system == 'Windows'",  # zoneinfo 在 Windows 无系统时区库
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lifemate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 500
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
